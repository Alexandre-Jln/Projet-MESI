# =============================================================
#  PotCommun - Configuration Spring Boot
# =============================================================
spring.config.import=optional:file:../.env[.properties]

server.port=8082

# --- DataSource MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/potcommun?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:potcommun_user}
spring.datasource.password=${DB_PASSWORD:potcommun_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Chiffrement emails (AES-256) ---
app.encryption.key=${APP_ENCRYPTION_KEY}

# --- Stripe ---
# Cles disponibles sur https://dashboard.stripe.com/test/apikeys
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_test_placeholder}
