# =============================================================
#  PotCommun ? Configuration Spring Boot
#  Chemin : backend/src/main/resources/application.properties
# =============================================================

# --- Serveur ---
server.port=8080

# --- DataSource MySQL ---
# DB_HOST vaut "db" dans Docker (nom du service docker-compose)
# et "localhost" en développement local ? la valeur par défaut gère les deux cas
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/potcommun?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:potcommun_user}
spring.datasource.password=${DB_PASSWORD:potcommun_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Délai de connexion (au cas où Docker met du temps à démarrer) ---
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000