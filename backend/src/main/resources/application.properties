# =============================================================
#  PotCommun – Configuration Spring Boot
#  Chemin : backend/src/main/resources/application.properties
# =============================================================

# --- Serveur ---
server.port=8080

# --- DataSource MySQL (Docker) ---
spring.datasource.url=jdbc:mysql://localhost:3306/potcommun?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=potcommun_user
spring.datasource.password=potcommun_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate : Hibernate vérifie le schéma sans le modifier (recommandé)
# update   : Hibernate adapte le schéma automatiquement (pratique en dev)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Délai de connexion (au cas où Docker met du temps à démarrer) ---
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# Hcaptcha sécurité secret key
hcaptcha.secret=${HCAPTCHA_SECRET}