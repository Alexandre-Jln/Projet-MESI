# Apache Maven Wrapper — type "only-script"
# Les scripts mvnw / mvnw.cmd téléchargent automatiquement cette distribution
# de Maven dans ~/.m2/wrapper la première fois, puis la réutilisent.
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
