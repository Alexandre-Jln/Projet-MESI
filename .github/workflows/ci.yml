name: CI — Build & Test

on:
  push:
    branches:
      - main
      - develop
      - staging
      - 'SCRUM-*'
  pull_request:
    branches:
      - main
      - staging
      - develop

jobs:
  backend:
    name: Backend — Java / Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build et tests Maven
        run: mvn clean package --no-transfer-progress

      - name: Upload de l'artefact JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7

  frontend:
    name: Frontend — React / Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Build de l'application React
        working-directory: frontend
        run: npm run build

      - name: Upload du build React
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7